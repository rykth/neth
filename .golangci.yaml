linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec

linters-settings:
  errcheck:
    check-blank: false

issues:
  exclude-rules:
    # Test files: allow unchecked errors in cleanup/helper calls and gosec warnings
    # on test-only patterns (temp files, random ports, etc.)
    - path: _test\.go
      linters:
        - errcheck
        - gosec
    # nolint directives in source are honoured; no extra exclusions needed.
